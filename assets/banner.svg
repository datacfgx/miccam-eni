<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E0E16"/>
      <stop offset="1" stop-color="#060609"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#50FF8C"/>
      <stop offset="1" stop-color="#2EC85A"/>
    </linearGradient>
    <pattern id="knit" width="56" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 14 H56" stroke="#15151F" stroke-width="3"/>
      <path d="M14 0 V28 M42 0 V28" stroke="#111119" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#knit)" opacity="0.55"/>
  <!-- marca: mic com ondas -->
  <g transform="translate(96,105)">
    <rect width="210" height="210" rx="46" fill="#10121A" stroke="url(#green)" stroke-width="6"/>
    <rect x="82" y="36" width="46" height="82" rx="23" fill="url(#green)"/>
    <line x1="88" y1="60" x2="122" y2="60" stroke="#0A0A10" stroke-width="5" stroke-linecap="round"/>
    <line x1="88" y1="78" x2="122" y2="78" stroke="#0A0A10" stroke-width="5" stroke-linecap="round"/>
    <line x1="88" y1="96" x2="122" y2="96" stroke="#0A0A10" stroke-width="5" stroke-linecap="round"/>
    <path d="M66 94 a40 40 0 0 0 78 0" fill="none" stroke="#50FF8C" stroke-width="8" stroke-linecap="round"/>
    <line x1="105" y1="134" x2="105" y2="156" stroke="#50FF8C" stroke-width="8" stroke-linecap="round"/>
    <line x1="76" y1="160" x2="134" y2="160" stroke="#50FF8C" stroke-width="8" stroke-linecap="round"/>
    <path d="M156 64 a32 32 0 0 1 0 48" fill="none" stroke="#2EC85A" stroke-width="7" stroke-linecap="round"/>
    <path d="M172 50 a52 52 0 0 1 0 76" fill="none" stroke="#1E7A3C" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- wordmark -->
  <text x="370" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="96" font-weight="800" fill="#F2F3F7">MicCam</text>
  <text x="770" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="96" font-weight="800" fill="url(#green)">ENI</text>
  <text x="374" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="33" fill="#9AA0B4">Gravador de vídeo com ganho de microfone 1x–5x</text>
  <!-- chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600">
    <rect x="370" y="292" width="212" height="54" rx="27" fill="#141824" stroke="#2A2E42" stroke-width="2"/>
    <text x="476" y="328" fill="#C8CCDC" text-anchor="middle">Android 7.0+</text>
    <rect x="598" y="292" width="268" height="54" rx="27" fill="#141824" stroke="#2A2E42" stroke-width="2"/>
    <text x="732" y="328" fill="#C8CCDC" text-anchor="middle">Motorola-friendly</text>
    <rect x="884" y="292" width="96" height="54" rx="27" fill="#14231A" stroke="#2EC85A" stroke-width="2"/>
    <text x="932" y="328" fill="#50FF8C" text-anchor="middle">MIT</text>
  </g>
  <text x="1272" y="404" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#4A4F63" text-anchor="end">família ENI · feito com suéter e café 🖤☕🧶</text>
